[project]
name = "codee-azure-blob-files"
version = "0.1.0"
description = "Codee plugin: serve files from a private Azure Blob container on the admin UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # The plugin API (codee_plugin_abstract) ships inside codee-agent.
    "codee-agent >= 0.9.7",
    "azure-storage-blob >= 12.19,<13",
    "azure-identity >= 1.15,<2",
]

[project.entry-points."codee.plugins"]
files = "codee_azure_blob_files.plugin:AzureBlobFilesPlugin"

[tool.uv.sources]
codee-agent = { workspace = true }

[build-system]
requires = ["uv_build >= 0.11.29,<0.12"]
build-backend = "uv_build"
